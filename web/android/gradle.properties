# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx1536m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

android.overridePathCheck=true

# ── 세션52 (2026-09-04) — gradlew 가 쓸 JDK 를 «명시»한다 ─────────────────────
#
# 증상: gradlew assembleDebug 가 :capacitor-android:compileDebugJavaWithJavac 에서
#       `error: invalid source release: 21` 로 죽었다.
#
# 원인: Capacitor 8 이 JDK 21 을 요구한다.
#       node_modules/@capacitor/android/capacitor/build.gradle:66-67
#           sourceCompatibility JavaVersion.VERSION_21
#           targetCompatibility JavaVersion.VERSION_21
#       그런데 제이 PC 의 시스템 java 는 Temurin 17.0.18 이다(실측).
#       Android Studio 는 «내장» JBR 21.0.10 을 쓰므로 IDE 에서는 빌드가 됐고,
#       명령줄 gradlew 는 시스템 JAVA_HOME 을 따라가 17 로 돌아 죽었다.
#       → 같은 프로젝트가 IDE 에서는 되고 터미널에서는 안 되는 형태다(규칙67 의 친척).
#
# ⛔ 하지 말 것:
#   - node_modules 의 sourceCompatibility 를 17 로 낮추기
#       → `npm install` 한 번이면 날아가고, 21 로 컴파일된 클래스를 참조하면 런타임에 터진다
#   - Capacitor 를 7 로 다운그레이드 → 앱 전체 재검증
#
# ⚠ 이 경로는 «제이 PC 전용»이다. 다른 PC 나 CI 에서는 그 환경의 JDK 21 경로로 바꾸거나
#   이 줄을 지우고 JAVA_HOME 을 21 로 맞출 것. Android Studio 를 옮기면 여기도 고쳐야 한다.
#   확인: & "C:\Program Files\Android\Android Studio\jbr\bin\java.exe" -version
#
# ⚠ 값에는 «슬래시»를 쓴다. .properties 에서 백슬래시는 이스케이프 문자라
#   C:\Program... 으로 쓰면 조용히 잘못된 경로가 된다.
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
